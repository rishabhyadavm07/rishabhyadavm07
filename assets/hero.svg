    <stop offset="0%" stop-color="#0B1222"/>
    <stop offset="100%" stop-color="#070B16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#A78BFA"/>
